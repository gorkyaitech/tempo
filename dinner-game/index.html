ius:28px;background:linear-gradient(160deg,#271039,#0d0921);box-shadow:0 30px 90px #000b;animation:in .22s ease}.conf{position:fixed;z-index:100;top:-18px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall var(--d) linear forwards}@keyframes fall{to{transform:translate3d(var(--x),112vh,0) rotate(var(--r));opacity:.9}}@media(max-width:390px){.grid{grid-template-columns:1fr}.choice{min-height:82px}.choice .e{display:inline-block;margin:0 8px 0 0}.stage{min-height:650px}.hero{height:160px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">💘</div><div><b>The Dinner Games</b><small>Hallandale Beach · love, hunger & questionable appeals</small></div></div><button class="secondary btn" id="restart" style="min-height:42px;padding:9px 12px">↻</button></header><div class="progress"><div class="bar" id="bar"></div></div><section class="stage" id="stage"></section></main><div class="toast" id="toast"></div><div class="modal" id="loophole"><div class="panel"><span class="pill">🚨 Dinner Court emergency</span><h2>She still can’t decide.</h2><div class="love" style="min-height:auto;margin:8px 0 16px"><div><div class="heart" style="font-size:58px">💘</div><p class="quote" id="appealText" style="font-size:25px"></p><p class="sub">Exactly one secret bonus option is available. After that, the hungry husband becomes the Supreme Court.</p></div></div><button class="btn primary wide" id="bonus">Fine… show me ONE more 😇</button><button class="btn secondary wide" id="keep" style="margin-top:9px">Okay, keep this one ❤️</button></div></div><script>
const $=s=>document.querySelector(s),A={name:'beautiful',step:-1,p:{},veto:1,bonus:1},Q=[{k:'mood',t:'What kind of dinner energy is this?',s:'The algorithm has no medical license, but excellent instincts.',max:1,o:[['comfort','🛋️','Couch royalty','Carbs, comfort, zero emotional labor.'],['fancy','✨','Fancy at home','Date-night food. Shoes optional.'],['fresh','🥗','Fresh-ish','One responsible decision, still delicious.'],['spicy','🌶️','Spicy chaos','Flavor first. Consequences tomorrow.'],['fast','⚡','Feed us quickly','Romance is nice. Hunger is louder.'],['adventure','🎲','Surprise us','Surrender to the food universe.']]},{k:'cuisine',t:'Pick up to three cravings.',s:'Choose before your brain forms a committee.',max:3,o:[['italian','🍕','Italian & pizza','Cheese enters negotiations.'],['sushi','🍣','Sushi & Japanese','Serious soy-sauce energy.'],['med','🥙','Turkish & Mediterranean','Kebabs, mezze, hummus, victory.'],['latin','🫓','Latin & Venezuelan','Arepas, Cuban plates and comfort.'],['mex','🌮','Mexican','Tacos are structural happiness.'],['asian','🥡','Chinese & Asian','Noodles and emotional repair.'],['indian','🍛','Indian','Warm spices, no boring bites.'],['burger','🍔','Burgers & chicken','Subtlety has left the chat.'],['healthy','🥗','Healthy-ish','Responsible, not depressing.'],['surprise','🪄','Dealer’s choice','I accept destiny.']]},{k:'budget',t:'What is tonight’s budget mood?',s:'Food total for two, before tax, tips and fee multiverses.',max:1,o:[['1','💵','Keep it cute · under $35','Good food, no financial documentary.'],['2','💳','Date-night middle · $35–60','Enough food, still emotionally stable.'],['3','💎','Treat ourselves · $60+','Release the appetizers. We survived.']]},{k:'avoid',t:'Anything we should avoid?',s:'Pick any. Confirm allergies directly with the restaurant.',max:6,o:[['sea','🚫🐟','No seafood','Keep the ocean outside.'],['raw','🔥🍣','No raw fish','Cooked, please.'],['veg','🌱','Vegetarian-friendly','Plants, but interesting.'],['mild','🧊','Keep it mild','Flavor yes. Fire alarm no.'],['pork','🚫🥓','No pork','Easy substitutions preferred.'],['none','🟢','No restrictions','Let the menu run free.']]}],R=[{n:"Doggi's Arepa Bar",i:'🫓',c:['latin'],m:['comfort','fast'],p:2,a:'801 N Federal Hwy, Hallandale Beach',o:'https://order.toasttab.com/online/doggis-arepa-bar-hallandale',d:'Venezuelan arepas, cachapas and tequeños.',x:'Two different arepas or cachapas, tequeños, then trade bites before plate envy begins.',bad:['pork']},{n:'Piola Hallandale',i:'🍕',c:['italian'],m:['comfort','fancy'],p:2,a:'1703 E Hallandale Beach Blvd',o:'https://piolausa.com/locations-hallandale-beach-fl/',d:'Thin-crust Italian pizza and fresh Italian food.',x:'Split one classic and one adventurous pizza; negotiate the final slice later.',bad:['pork']},{n:'Gioia Italy',i:'🍝',c:['italian'],m:['fancy','comfort'],p:3,a:'701 N Federal Hwy, Hallandale Beach',o:'https://gioiaitaly.com/',d:'Premium Italian pizza, pasta and dessert.',x:'One pasta, one pizza and a shared starter. Shoes remain optional.',bad:['pork','sea']},{n:'Alacati Mediterranean',i:'🧿',c:['med'],m:['fancy','adventure'],p:3,a:'1403 Hallandale Beach Blvd',o:'https://alacatirestaurantfl.com/',d:'Turkish and Greek-inspired mezze and kebabs.',x:'Build a mezze spread, add one grilled entrée and finish with baklava.',bad:['sea']},{n:'Shahs of Kabob',i:'🍢',c:['med','healthy'],m:['fresh','fast','comfort'],p:2,a:'800 E Hallandale Beach Blvd',o:'https://eatkabob.com/shahshallandalebeach',d:'Persian kabobs, platters, wraps, rice and salads.',x:'One chicken and one koobideh platter or wrap, with rice and salad to share.',bad:[]},{n:'A Touch of Cuba',i:'🇨🇺',c:['latin'],m:['comfort','fast'],p:1,a:'117 E Hallandale Beach Blvd',o:'https://www.getsauce.com/order/site/a-touch-of-cuba-restaurant/',d:'Cuban comfort food with direct ordering.',x:'Two classic plates with rice, beans or plantains. Dessert is mandatory.',bad:['pork','sea']},{n:'Sokai Sushi Bar',i:'🍣',c:['sushi'],m:['fancy','adventure','fresh'],p: t finding: I love you ridiculously much.`];const from=decodeURIComponent((location.hash.match(/from=([^&]+)/)||[])[1]||'Görkem');function toast(x){const t=$('#toast');t.textContent=x;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2100)}function conf(){let c=['#ff4788','#f6c85f','#70e2c0','#fff','#9f78ff'];for(let i=0;i<60;i++){let e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%c.length];e.style.setProperty('--d',2.3+Math.random()*2+'s');e.style.setProperty('--x',Math.random()*220-110+'px');e.style.setProperty('--r',Math.random()*900-450+'deg');e.style.animationDelay=Math.random()*.3+'s';document.body.append(e);setTimeout(()=>e.remove(),4700)}}function shell(x){$('#stage').innerHTML=x;$('#stage').style.animation='none';requestAnimationFrame(()=>$('#stage').style.animation='in .28s ease');$('#bar').style.width=A.step<0?'0%':Math.min(100,(A.step+1)/(Q.length+2)*100)+'%';window.scrollTo({top:0,behavior:'smooth'})}function welcome(){A.step=-1;shell(`<span class="pill">🌴 Hallandale edition</span><h1>Tonight, we end the “what do you want?” crisis.</h1><p class="lead">A highly scientific dinner game made by ${from} for his favorite person.</p><div class="hero"><div class="sun"></div><div class="water"></div><div class="palm a">🌴</div><div class="palm b">🌴</div><div class="float f1">🍕</div><div class="float f2">🍣</div><div class="float f3">🌮</div></div><div class="rule"><span>📜</span><span><b>Official rule:</b> “I don't care” loses legal force after three rejected suggestions. You get one dramatic veto. Being adorable may unlock one illegal appeal.</span></div><div class="field"><label>What should the game call you?</label><input id="name" maxlength="28" placeholder="Your name or a ridiculous nickname"></div><div class="actions"><button class="btn primary wide" id="go">Start the dinner trial →</button></div><p class="fine">No login or tracking. Hours, delivery coverage, prices, fees and ingredients can change.</p>`);$('#go').onclick=()=>{A.name=$('#name').value.trim()||'beautiful';question(0)}}function question(i){A.step=i;let q=Q[i],sel=A.p[q.k]||[];shell(`<span class="pill">Round ${i+1} · dinner diplomacy</span><h2>${q.t}</h2><p class="sub">${q.s}</p><div class="grid">${q.o.map(o=>`<button class="choice ${sel.includes(o[0])?'sel':''}" data-v="${o[0]}"><span class="ck">✓</span><span class="e">${o[1]}</span><b>${o[2]}</b><small>${o[3]}</small></button>`).join('')}</div><div class="actions"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="next" ${sel.length?'':'disabled'}>${i===Q.length-1?'Lock the treaty 💘':'Next →'}</button></div>`);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let v=b.dataset.v,a=A.p[q.k]||[];if(q.k==='avoid'&&v==='none')a=a.includes(v)?[]:['none'];else if(q.k==='avoid'){a=a.filter(x=>x!=='none');a=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else if(q.max===1)a=a.includes(v)?[]:[v];else if(a.includes(v))a=a.filter(x=>x!==v);else if(a.length<q.max)a=[...a,v];else return toast(`Maximum ${q.max}. Dinner democracy has limits.`);A.p[q.k]=a;question(i)});$('#back').onclick=()=>i?question(i-1):welcome();$('#next').onclick=()=>i===Q.length-1?love():question(i+1)}function love(){A.step=Q.length;let n=notes[Math.floor(Math.random()*notes.length)](A.name);shell(`<span class="pill">Mandatory love intermission</span><h2>Before the dinner verdict…</h2><div class="love"><div><div class="heart">❤️</div><p class="quote">${n}</p><p class="sub">— ${from}, who is hungry but still romantic</p></div></div><div class="actions"><button class="btn primary wide" id="reveal">Reveal our dinner destiny ✨</button><button class="btn ghost wide" id="another">Another ridiculous love note</button></div>`);$('#reveal').onclick=result;$('#another').onclick=love}function scored(r){let s=40,m=A.p.mood?.[0],c=A.p.cuisine||[],b=+(A.p.budget?.[0]||2),x=A.p.avoid||[];if(r.m.includes(m))s+=18;if(c.includes('surprise'))s+=Math.random()*15;else if(r.c.some(z=>c.includes(z)))s+=22;s+=r.p===b?13:Math.abs(r.p-b)===1?3:-8;if(x.includes('sea')&&r.bad.includes('sea'))s-=45;if(x.includes('raw')&&r.bad.includes('raw'))s-=40;if(x.includes('pork')&&r.bad.includes('pork'))s-=25;if(x.includes('mild')&&r.m.includes('spicy'))s-=14;if(x.includes('veg')&&!r.c.includes('healthy')&&!r.c.includes('med')&&!r.c.includes('indian'))s-=10;return{...r,s:s+Math.random()*5}}function result(){A.step=Q.length+1;A.rank=R.map(scored).sort((a,b)=>b.s-a.s);A.veto=1;A.bonus=1;show()}function show(){let r=A.rank[0],alts=A.rank.slice(1,4),appeal=A.veto?'Use the one legal veto':A.bonus?'I still can’t decide 😇':'Final-final answer ❤️';shell(`<span class="pill">🏆 The universe has been consulted</span><h2>The verdict is in, ${A.name}.</h2><p class="sub">The committee has spoken. Complaints may be filed after dessert.</p><article class="winner"><span class="ribbon">Tonight's official winner</span><div class="winhead"><div class="ri">${r.i}</div><div><h3>${r.n}</h3><div class="meta">${r.c.join(' · ')} · ${'$'.repeat(r.p)} · ${r.a}</div></div></div><div class="why">This won because it fits your cravings, mood and budget. ${r.d}</div><div class="order"><b>Low-stress order idea for two</b>${r.x}</div><div class="actions" style="padding-top:0"><a class="btn primary" href="${r.o}" target="_blank" rel="noopener">Open ordering ↗</a><a class="btn secondary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.n+' '+r.a)}" target="_blank" rel="noopener">Map</a></div></article><h3 style="margin:20px 0 8px">Also highly compatible</h3><div class="alts">${alts.map(x=>`<div class="alt"><div class="ae">${x.i}</div><div><b>${x.n}</b><small>${x.c.join(' · ')} · ${'$'.repeat(x.p)}</small></div></div>`).join('')}</div><div class="actions"><button class="btn primary" id="share">Share verdict 💬</button><button class="btn secondary" id="veto" ${!A.veto&&!A.bonus?'disabled':''}>${appeal}</button><button class="btn ghost" id="again">Start over</button></div><p class="fine">Shortlist uses real nearby restaurants, but verify live delivery coverage, hours, fees, prices, ingredients and allergen handling before ordering.</p>`);conf();$('#again').onclick=reset;$('#veto').onclick=()=>{if(A.veto){A.veto=0;A.rank.push(A.rank.shift());toast('Veto accepted. The court is deeply offended.');show()}else if(A.bonus){$('#appealText').textContent=`${A.name}, you already used the official veto… but ${from} loves you enough to file a Love Loophole.`;$('#loophole').classList.add('show')}};$('#share').onclick=share}function share(){let r=A.rank[0],t=`💘 The Hallandale Dinner Games have spoken!\n\nTonight's winner: ${r.n}\n\nOfficial ruling: We are ordering this. The court considered every dramatic appeal. 😄\n\nMade with love by ${from}.`;if(navigator.share)navigator.share({title:'Tonight’s dinner verdict',text:t}).catch(()=>{});else location.href='https://wa.me/?text='+encodeURIComponent(t)}function reset(){A.p={};A.veto=1;A.bonus=1;$('#loophole').classList.remove('show');welcome()}$('#bonus').onclick=()=>{if(!A.bonus)return;A.bonus=0;A.rank.push(A.rank.shift());$('#loophole').classList.remove('show');toast('Love Loophole approved. This is the final-final-final answer.');show()};$('#keep').onclick=()=>{A.bonus=0;$('#loophole').classList.remove('show');toast('A historic decision. Dinner may now proceed. ❤️');show()};$('#restart').onclick=reset;welcome();
</script></body></html>

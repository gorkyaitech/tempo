name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tempo.dc.html'
      - 'support.js'
      - 'vendor/**'
      - '_ds/**'
      - 'icons/**'
      - 'assets/**'
      - 'scripts/**'
      - 'native/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Assemble web assets
        run: node scripts/build-www.mjs

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate icons & splash screens
        run: npx capacitor-assets generate --ios

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Inject native Swift (plugin + Live Activity + widgets)
        run: |
          mkdir -p ios/App/App/TempoNative ios/App/TempoWidgets
          cp native/ios/plugin/TempoNativePlugin.swift ios/App/App/TempoNative/
          cp native/ios/plugin/TempoNativePlugin.m ios/App/App/TempoNative/
          cp native/ios/shared/TempoAttributes.swift ios/App/App/TempoNative/
          cp native/ios/widgets/TempoWidgets.swift ios/App/TempoWidgets/
          cp native/ios/shared/TempoAttributes.swift ios/App/TempoWidgets/
          cp native/ios/widgets/Info.plist ios/App/TempoWidgets/
          plutil -replace NSSupportsLiveActivities -bool YES ios/App/App/Info.plist
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj -N
          ruby scripts/add-widget-target.rb

      - name: Build (simulator, unsigned)
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -sdk iphonesimulator
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package simulator app
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r Tempo-iOS-simulator.zip App.app

      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-iOS-simulator
          path: build/Build/Products/Release-iphonesimulator/Tempo-iOS-simulator.zip
          retention-days: 14

  testflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Assemble web assets
        run: node scripts/build-www.mjs

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate icons & splash screens
        run: npx capacitor-assets generate --ios

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Inject native Swift (plugin + Live Activity + widgets)
        run: |
          mkdir -p ios/App/App/TempoNative ios/App/TempoWidgets
          cp native/ios/plugin/TempoNativePlugin.swift ios/App/App/TempoNative/
          cp native/ios/plugin/TempoNativePlugin.m ios/App/App/TempoNative/
          cp native/ios/shared/TempoAttributes.swift ios/App/App/TempoNative/
          cp native/ios/widgets/TempoWidgets.swift ios/App/TempoWidgets/
          cp native/ios/shared/TempoAttributes.swift ios/App/TempoWidgets/
          cp native/ios/widgets/Info.plist ios/App/TempoWidgets/
          plutil -replace NSSupportsLiveActivities -bool YES ios/App/App/Info.plist
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO ios/App/App/Info.plist
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj -N
          ruby scripts/add-widget-target.rb

      - name: Write App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
        run: |
          for d in ~/private_keys ~/.private_keys ~/.appstoreconnect/private_keys ./private_keys; do
            mkdir -p "$d"
            printf '%s' "$ASC_KEY_B64" | tr -d '\r\n ' | base64 --decode > "$d/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          done
          head -1 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Archive (cloud-managed signing)
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/Tempo.xcarchive
          archive
          -allowProvisioningUpdates
          -authenticationKeyPath $HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MARKETING_VERSION=1.0
          CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export & upload to TestFlight
        run: |
          cat > exportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>TEAM_ID_PLACEHOLDER</string>
          </dict>
          </plist>
          EOF
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/" exportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Tempo.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath $HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

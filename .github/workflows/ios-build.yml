name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tempo.dc.html'
      - 'support.js'
      - 'vendor/**'
      - '_ds/**'
      - 'icons/**'
      - 'assets/**'
      - 'scripts/**'
      - 'native/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Assemble web assets
        run: node scripts/build-www.mjs

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate icons & splash screens
        run: npx capacitor-assets generate --ios

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Inject native Swift (plugin + Live Activity + widgets)
        run: |
          mkdir -p ios/App/App/TempoNative ios/App/TempoWidgets
          cp native/ios/plugin/TempoNativePlugin.swift ios/App/App/TempoNative/
          cp native/ios/plugin/TempoNativePlugin.m ios/App/App/TempoNative/
          cp native/ios/shared/TempoAttributes.swift ios/App/App/TempoNative/
          cp native/ios/widgets/TempoWidgets.swift ios/App/TempoWidgets/
          cp native/ios/shared/TempoAttributes.swift ios/App/TempoWidgets/
          cp native/ios/widgets/Info.plist ios/App/TempoWidgets/
          plutil -replace NSSupportsLiveActivities -bool YES ios/App/App/Info.plist
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj -N
          ruby scripts/add-widget-target.rb

      - name: Build (simulator, unsigned)
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -sdk iphonesimulator
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package simulator app
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r Tempo-iOS-simulator.zip App.app

      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-iOS-simulator
          path: build/Build/Products/Release-iphonesimulator/Tempo-iOS-simulator.zip
          retention-days: 14

  testflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Assemble web assets
        run: node scripts/build-www.mjs

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate icons & splash screens
        run: npx capacitor-assets generate --ios

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Inject native Swift (plugin + Live Activity + widgets)
        run: |
          mkdir -p ios/App/App/TempoNative ios/App/TempoWidgets
          cp native/ios/plugin/TempoNativePlugin.swift ios/App/App/TempoNative/
          cp native/ios/plugin/TempoNativePlugin.m ios/App/App/TempoNative/
          cp native/ios/shared/TempoAttributes.swift ios/App/App/TempoNative/
          cp native/ios/widgets/TempoWidgets.swift ios/App/TempoWidgets/
          cp native/ios/shared/TempoAttributes.swift ios/App/TempoWidgets/
          cp native/ios/widgets/Info.plist ios/App/TempoWidgets/
          plutil -replace NSSupportsLiveActivities -bool YES ios/App/App/Info.plist
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO ios/App/App/Info.plist
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj -N
          ruby scripts/add-widget-target.rb

      - name: Write App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
        run: |
          for d in ~/private_keys ~/.private_keys ~/.appstoreconnect/private_keys ./private_keys; do
            mkdir -p "$d"
            printf '%s' "$ASC_KEY_B64" | tr -d '\r\n ' | base64 --decode > "$d/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          done
          head -1 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Install signing identity & profiles
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12_B64 }}
          P12_PASS: ${{ secrets.DIST_CERT_P12_PASSWORD }}
          PROF_APP: ${{ secrets.PROFILE_APP_B64 }}
          PROF_WIDGET: ${{ secrets.PROFILE_WIDGET_B64 }}
        run: |
          printf '%s' "$P12_B64" | tr -d '\r\n ' | base64 --decode > dist.p12
          security create-keychain -p ci-tmp ci.keychain
          security list-keychains -d user -s ci.keychain login.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci-tmp ci.keychain
          security set-keychain-settings -lut 21600 ci.keychain
          security import dist.p12 -k ci.keychain -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-tmp ci.keychain > /dev/null
          security find-identity -v -p codesigning
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            printf '%s' "$PROF_APP" | tr -d '\r\n ' | base64 --decode > "$d/tempo-app.mobileprovision"
            printf '%s' "$PROF_WIDGET" | tr -d '\r\n ' | base64 --decode > "$d/tempo-widgets.mobileprovision"
          done

      - name: Archive (manual signing)
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/Tempo.xcarchive
          archive
          MARKETING_VERSION=1.0
          CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # Xcode 26's exportArchive distribution path can't resolve manual
      # signing assets on CI. The archive is already fully signed, so the
      # IPA is packaged directly (no SwiftSupport needed at iOS 13+).
      - name: Package IPA from archive
        run: |
          mkdir -p build/export/Payload
          cp -R "build/Tempo.xcarchive/Products/Applications/App.app" build/export/Payload/
          cd build/export
          zip -qry App.ipa Payload
          ls -la

      - name: Upload to TestFlight (fastlane)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
        run: |
          # NTP is blocked on hosted runners; set clock from an HTTPS Date header
          echo "runner clock before: $(date -u)"
          HDR=$(curl -sI https://www.apple.com/ | tr -d '\r' | awk 'tolower($1)=="date:"{$1="";print substr($0,2);exit}')
          echo "apple says:          $HDR"
          SET=$(date -ju -f '%a, %d %b %Y %H:%M:%S %Z' "$HDR" '+%m%d%H%M%y.%S') && sudo date -u "$SET" || true
          echo "runner clock after:  $(date -u)"
          CLEAN_B64=$(printf '%s' "$ASC_KEY_B64" | tr -d '\r\n ')
          jq -n --arg kid "$ASC_KEY_ID" --arg iss "$ASC_ISSUER_ID" --arg key "$CLEAN_B64" \
            '{key_id:$kid, issuer_id:$iss, key:$key, is_key_content_base64:true, in_house:false}' > asc_key.json
          IPA=$(ls build/export/*.ipa | head -1)
          echo "uploading $IPA"
          fastlane pilot upload --ipa "$IPA" --api_key_path asc_key.json --skip_waiting_for_build_processing true --verbose
